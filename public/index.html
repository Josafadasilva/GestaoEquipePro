<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gestão de Equipe — Trivia</title>
<meta name="theme-color" content="#13205a">
<link rel="icon" type="image/png" href="/favicon-32.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="stylesheet" href="/style.css">
</head>
<body>

<!-- ═════════ LOGIN ═════════ -->
<div id="tela-login" class="tela-login" hidden>
  <div class="login-card" id="card-login">
    <div class="login-logo"><img src="/logo.png" alt="Trivia"></div>
    <h1>Gestão de Equipe</h1>
    <p class="login-sub">Manutenção de Sinalização</p>

    <form id="form-login" novalidate>
      <label class="campo"><span>E-mail</span>
        <input type="email" id="login-email" autocomplete="username" inputmode="email" placeholder="nome@triviatrens.com.br" required></label>
      <label class="campo"><span>Senha</span>
        <div class="senha-wrap">
          <input type="password" id="login-senha" autocomplete="current-password" required>
          <button type="button" class="ver-senha" data-alvo="login-senha" aria-label="Mostrar senha">Mostrar</button>
        </div></label>
      <p class="msg-erro" id="login-erro" role="alert"></p>
      <button type="submit" class="btn btn-pri btn-lg btn-bloco" id="btn-entrar">Entrar</button>
    </form>
    <p class="login-rodape">Primeiro acesso? <a href="#" id="link-solicitar">Pedir cadastro</a></p>
  </div>

  <div class="login-card" id="card-solicitar" hidden>
    <button class="voltar" id="voltar-login" type="button">← Voltar</button>
    <h1>Pedir cadastro</h1>
    <p class="login-sub">Um supervisor vai aprovar e você recebe acesso com este e-mail e senha.</p>
    <form id="form-solicitar" novalidate>
      <label class="campo"><span>Nome completo</span><input id="sol-nome" autocomplete="name" required></label>
      <label class="campo"><span>E-mail da empresa</span><input type="email" id="sol-email" inputmode="email" placeholder="nome@triviatrens.com.br" required></label>
      <div class="grade-2">
        <label class="campo"><span>Senha</span><input type="password" id="sol-senha" autocomplete="new-password" placeholder="Mín. 8 caracteres" required></label>
        <label class="campo"><span>Repita a senha</span><input type="password" id="sol-senha2" autocomplete="new-password" required></label>
      </div>
      <div class="campo"><span>Base</span><div class="chips-escolha" id="sol-base" data-nome="base"></div></div>
      <div class="campo"><span>Escala</span><div class="chips-escolha" id="sol-escala" data-nome="escala"></div></div>
      <div class="grade-2">
        <div class="campo"><span>Turno</span><div class="chips-escolha" id="sol-turno" data-nome="turno"></div></div>
        <label class="campo"><span>Data de admissão</span><input type="date" id="sol-admissao" required></label>
      </div>
      <p class="msg-erro" id="sol-erro" role="alert"></p>
      <button type="submit" class="btn btn-pri btn-lg btn-bloco" id="btn-solicitar">Enviar pedido</button>
    </form>
  </div>
</div>

<!-- ═════════ APP ═════════ -->
<div id="tela-app" class="tela-app" hidden>
  <header class="topo">
    <div class="topo-in">
      <div class="marca"><span class="marca-logo"><img src="/logo.png" alt="Trivia"></span><span class="marca-nome">Gestão de Equipe</span></div>
      <button class="usuario" id="btn-usuario" type="button"><span class="avatar" id="topo-avatar"></span><span class="usuario-nome" id="topo-nome"></span></button>
    </div>
    <div class="faixas" aria-hidden="true"><i></i><i></i><i></i></div>
  </header>

  <div class="corpo">
    <nav class="menu-lateral" id="menu-lateral" aria-label="Menu"></nav>
    <main class="conteudo" id="conteudo" tabindex="-1"></main>
  </div>

  <nav class="menu-inferior" id="menu-inferior" aria-label="Menu"></nav>
</div>

<!-- Painel deslizante (formulários) -->
<div class="painel-fundo" id="painel-fundo" hidden>
  <section class="painel" id="painel" role="dialog" aria-modal="true" aria-labelledby="painel-titulo">
    <header class="painel-topo">
      <button class="painel-fechar" type="button" data-fechar aria-label="Fechar">✕</button>
      <h2 id="painel-titulo"></h2>
    </header>
    <div class="painel-corpo" id="painel-corpo"></div>
    <footer class="painel-rodape" id="painel-rodape"></footer>
  </section>
</div>

<!-- Confirmação -->
<div class="dialogo-fundo" id="dialogo" hidden>
  <div class="dialogo" role="alertdialog" aria-modal="true" aria-labelledby="dialogo-titulo">
    <h3 id="dialogo-titulo"></h3>
    <p id="dialogo-texto"></p>
    <div class="dialogo-botoes"><button class="btn btn-sec" id="dialogo-nao" type="button">Cancelar</button><button class="btn btn-pri" id="dialogo-sim" type="button">Confirmar</button></div>
  </div>
</div>

<!-- Menu de ações (⋯) -->
<div class="acoes-fundo" id="acoes" hidden><div class="acoes" id="acoes-lista" role="menu"></div></div>

<div class="avisos" id="avisos" aria-live="polite"></div>

<!-- Modelo de impressão (PDF) -->
<div id="impressao" class="impressao"></div>

<script src="/app.js"></script>
</body>
</html>
