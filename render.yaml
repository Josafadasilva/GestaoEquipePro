services:
  - type: web
    name: gestaoequipepro
    env: node
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: ALLOWED_DOMAIN
        value: triviatrens.com.br
      - key: NODE_ENV
        value: production
